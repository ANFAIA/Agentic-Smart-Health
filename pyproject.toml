[project]
name = "agentic-smart-health"
version = "0.1.0"
description = "Agentic Smart Health - Monorepo raíz"
requires-python = ">=3.13"
dependencies = [
    "agent-orchestrator",
    "analysis-agents",
    "core-schemas",
    "export-agents",
    "fusion-agents",
    # Sin el extra `gpu`: el ajuste del campo necesita torch y la raiz no puede
    # arrastrar CUDA a quien solo quiera correr las pruebas de los agentes.
    "gaussian-engine",
    "ingestion-agents",
    "tooth-aggregation",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

# Herramientas del agente guardián de CI (revisión estática, sin LLM).
#
# Ruff y MyPy van **clavados**, no con `>=`. Son puertas de merge, y un linter que
# se actualiza solo estrena reglas sobre código que nadie ha tocado: el CI se pone
# rojo por un `uv sync` en una rama que no cambió nada. Con `ruff>=0.9` pasó — se
# instaló la 0.15 y aparecieron errores en ficheros de hace meses. Subir de versión
# es un commit deliberado que arregla lo que la versión nueva encuentre.
[dependency-groups]
dev = [
    "ruff==0.15.21",
    "mypy==2.3.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "vtk>=9.6.2",
    "numpy>=2.5.1",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]

# --- Cobertura ------------------------------------------------------------- #
# La configuracion vive aqui y NO en la linea de comandos del workflow, para que
# `uv run pytest --cov` mida en local exactamente lo mismo que mide el CI. Un
# umbral que solo existe en el CI es un umbral que se descubre cuando ya falla.
[tool.coverage.run]
source = [
    "packages/core-schemas/src",
    "packages/ingestion-agents/src",
    "packages/fusion-agents/src",
    "packages/analysis-agents/src",
    "packages/export-agents/src",
    "packages/tooth-aggregation/src",
    "apps/agent-orchestrator/src",
]
# `research-agent` queda fuera a proposito y conviene que se sepa: es un CLI que
# habla con un LLM y con Qdrant, no tiene pruebas hoy, e incluirlo hundiria el
# porcentaje sin decir nada util sobre la calidad de los agentes y el pipeline
# -- que es lo que el README se compromete a mantener por encima del 80%.
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
# El criterio de exito del proyecto (README): >80% en agentes y pipeline. Hoy la
# medida real es del 96%, asi que este liston protege contra un desplome, no
# contra un descuido. Subirlo a 90 es cambiar este numero y nada mas.
fail_under = 80
show_missing = true
skip_covered = true

[tool.uv.sources]
agent-orchestrator = { workspace = true }
analysis-agents = { workspace = true }
core-schemas = { workspace = true }
export-agents = { workspace = true }
fusion-agents = { workspace = true }
gaussian-engine = { workspace = true }
ingestion-agents = { workspace = true }
tooth-aggregation = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
# Las plantillas de las skills no son Python: llevan marcadores que se sustituyen al
# generar el agente, así que ni siquiera parsean. Excluirlas es lo correcto —
# "arreglarlas" para que pasen el linter las rompería como plantillas.
extend-exclude = [".venv", "data", "notebooks", ".claude/skills/*/templates"]
# Sin esto la exclusión no sirve en CI: el workflow le pasa a Ruff la lista de ficheros
# del PR uno a uno, y un fichero nombrado explícitamente se analiza aunque esté excluido.
# `force-exclude` hace que la regla mande también ahí, que es donde importa.
force-exclude = true

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear.
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# UP042 quiere `StrEnum` en vez de `(str, Enum)`. Aquí no: estos enums son el
# **vocabulario del contrato** (`SCHEMA_VERSION`), y el cambio no es cosmético —
# `StrEnum` cambia lo que devuelve `str(Modality.CBCT)` de `"Modality.CBCT"` a
# `"cbct"`, así que cualquier f-string o log que los interpole empezaría a decir
# otra cosa. Migrar es una decisión de contrato, con su versión de esquema, no un
# autofix del linter.
"packages/core-schemas/src/core_schemas/models.py" = ["UP042"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
exclude = ['^\.venv/', '^data/', '^notebooks/']
