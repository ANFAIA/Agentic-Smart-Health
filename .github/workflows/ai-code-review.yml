name: AI Code Review

# Agente guardián de CI: revisión estática (sin LLM) de cada Pull Request.
# Audita estilo (Ruff), tipos (MyPy) y reglas de arquitectura del monorepo.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies (incl. ruff + mypy)
        run: uv sync --group dev

      # Acota la revisión a los .py que toca el PR (guardián enfocado en el diff).
      - name: Collect changed files
        id: changed
        run: |
          uv run python scripts/audit_pr.py --list-changed > changed_files.txt
          echo "Archivos .py modificados:"
          cat changed_files.txt
          if [ -s changed_files.txt ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      # --- Estilo: Ruff genera anotaciones inline nativas de GitHub ---
      # SIN `continue-on-error`: esto bloquea. Anotar y dejar pasar convertía el linter
      # en decoración —el resumen decía "☑️ ejecutado" tanto si estaba limpio como si
      # no— y la deuda se acumulaba en ficheros que nadie volvía a mirar. La versión de
      # Ruff va clavada en `pyproject.toml` para que la puerta no se cierre sola cuando
      # salga una versión con reglas nuevas.
      - name: Ruff check
        id: ruff
        if: steps.changed.outputs.has_files == 'true'
        run: xargs -a changed_files.txt uv run ruff check --output-format=github

      # `ruff format` NO se comprueba, y conviene que conste por qué. El formato de este
      # repositorio es deliberado —tuplas agrupadas por significado, comentarios
      # alineados con el dato que explican— y `ruff format` lo deshace: reventaría
      # `_PROPIEDADES` en once líneas sueltas y perdería la agrupación x/y/z · escalas ·
      # rotación. Un check permanentemente rojo que nadie puede arreglar enseña a
      # ignorar los checks, así que se quita en vez de dejarlo avisando. Lo mecanizable
      # del formato (longitud de línea, imports) ya lo cubre `ruff check`.

      # --- Tipos: MyPy convertido a anotaciones inline ---
      # También bloquea, pero solo sobre el código que se ejecuta en producción — los
      # `src/` de `packages/` y `apps/`, que hoy están limpios—. Fuera quedan, medidos:
      #
      #   * `scripts/` (17 errores): exploratorio, carga módulos por `importlib` y vive
      #     de arrays sin tipar. Su producto es una medida, no un servicio.
      #   * los tests (49 errores): casi todos `snapshot: TwinSnapshot | None` sin
      #     estrechar, que en un test es legítimo porque el propio test ya afirma que no
      #     es None. Su puerta es pytest, que sí corre sobre todos.
      #   * `packages/3dgs-engine/`: el guion del nombre no es un identificador válido de
      #     Python y MyPy aborta antes de mirar nada. Excluirlo evita un rojo que no
      #     habla de tipos.
      #
      # Meter cualquiera de los tres cerraría la puerta en rojo desde el primer día, que
      # es la forma más rápida de que una puerta se desactive.
      - name: MyPy type check
        id: mypy
        # `!cancelled()` y no el `if` a secas: ahora que Ruff bloquea, un fallo suyo
        # saltaría todo lo que viene detrás y el PR se quedaría sin comprobar los tipos
        # ni —mucho peor— los guardianes de datos. Cada puerta da su veredicto; el job
        # falla igual si alguna se cierra.
        if: ${{ !cancelled() && steps.changed.outputs.has_files == 'true' }}
        run: |
          set -o pipefail
          grep '/src/' changed_files.txt | grep -v '3dgs-engine' > mypy_files.txt || true
          if [ ! -s mypy_files.txt ]; then
            echo "El PR no toca código de producción tipado; nada que comprobar."
            exit 0
          fi
          # El estado se guarda en vez de tragarse con `|| true`: primero se publican
          # las anotaciones —si no, los errores solo viven en el log— y al final se
          # sale con el código de MyPy, que es lo que cierra la puerta.
          estado=0
          xargs -a mypy_files.txt uv run mypy --show-column-numbers \
            --no-error-summary --explicit-package-bases \
            | tee mypy_report.txt || estado=$?
          python - <<'PY'
          import re
          from pathlib import Path
          rx = re.compile(r"^(.+?):(\d+):(?:(\d+):)?\s+(error|warning|note):\s+(.*)$")
          for line in Path("mypy_report.txt").read_text().splitlines():
              m = rx.match(line)
              if not m:
                  continue
              path, ln, col, level, msg = m.groups()
              gh = "error" if level == "error" else "warning"
              col_attr = f",col={col}" if col else ""
              msg = msg.replace("\n", " ")
              print(f"::{gh} file={path},line={ln}{col_attr}::mypy: {msg}")
          PY
          exit $estado

      # --- Coherencia documental: que el README no le mienta al código ---
      # Aquí y no en el workflow de tests a propósito: la deriva documental no
      # rompe nada en ejecución, así que lo que hay que impedir es que llegue a la
      # rama por defecto — y eso se decide en la PR, que es donde corre este job.
      # Sin `continue-on-error`: esto SI bloquea. Un enlace roto o un agente sin
      # ficha no rompen la ejecucion, pero se convierten en verdad publicada en
      # cuanto se mergea, y desmentirlos despues cuesta mucho mas que arreglarlos
      # ahora. `uv run python scripts/docs_sync.py --write` regenera lo generable.
      - name: Docs drift check
        if: ${{ !cancelled() }}
        run: uv run python scripts/docs_sync.py --check

      # --- Datos y licencias: que no entre dato ajeno al repositorio ---
      # Tampoco lleva `continue-on-error`, y por un motivo más fuerte que el
      # anterior: un binario mergeado ya no se quita: se reescribe la historia. La
      # issue 45 costó exactamente eso (`git filter-repo` + force-push) por 156 MiB
      # de PDF que nadie vio entrar. Esta comprobación es la que la habría evitado.
      - name: Data & licence guard
        if: ${{ !cancelled() }}
        run: uv run python scripts/data_guard.py --quiet

      # --- Arquitectura: reglas específicas del monorepo (Pydantic v2 / cross-app) ---
      - name: Architecture audit
        id: audit
        if: ${{ !cancelled() }}
        # Sigue con `continue-on-error` a propósito: este script sale siempre con 0 y
        # deja el veredicto en `line_comments.json`. Quien decide el bloqueo es el paso
        # de publicación, que necesita ese fichero para comentar en la línea afectada.
        run: uv run python scripts/audit_pr.py
        continue-on-error: true

      # --- Publica comentarios inline + resumen y decide el bloqueo ---
      - name: Publish review
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const comments = fs.existsSync('line_comments.json')
              ? JSON.parse(fs.readFileSync('line_comments.json', 'utf8'))
              : [];

            let auditBody = '';
            if (fs.existsSync('audit_report.txt')) {
              auditBody = fs.readFileSync('audit_report.txt', 'utf8').trim();
            }

            // 1) Comentarios inline en la línea afectada (violaciones de arquitectura).
            for (const c of comments) {
              try {
                await github.rest.pulls.createReviewComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id: context.payload.pull_request.head.sha,
                  path: c.path,
                  line: c.line,
                  body: c.body,
                });
              } catch (err) {
                core.warning(`No se pudo comentar en ${c.path}:${c.line} — ${err.message}`);
              }
            }

            // 2) Comentario-resumen del agente guardián.
            // El resultado real de cada puerta, no un "ejecutado" que decía lo mismo
            // con el linter limpio y con veinte errores. `skipped` es su propio estado:
            // un PR que no toca Python no ha pasado Ruff, y decir que sí sería falso.
            const veredicto = (outcome) => ({
              success: '✅ limpio',
              failure: '❌ bloquea el merge (ver anotaciones)',
              skipped: '➖ no aplica (el PR no toca Python)',
            }[outcome] || `⚠️ ${outcome}`);

            let summary = '## 🛡️ AI Code Review (estático, sin LLM)\n\n';
            summary += '| Chequeo | Resultado |\n|---|---|\n';
            summary += `| Ruff (estilo) | ${veredicto('${{ steps.ruff.outcome }}')} |\n`;
            summary += `| MyPy (tipos) | ${veredicto('${{ steps.mypy.outcome }}')} |\n`;
            if (comments.length === 0) {
              summary += '| Arquitectura | ✅ sin violaciones |\n\n';
              summary += 'No se han detectado dependencias cruzadas entre apps ni ';
              summary += 'incumplimientos de Pydantic v2 en `core-schemas`.\n';
            } else {
              summary += `| Arquitectura | ❌ ${comments.length} violación(es) |\n\n`;
              summary += `### Violaciones de arquitectura\n\n${auditBody}\n\n`;
              summary += '⚠️ **Estas reglas bloquean el merge.** Revisa los comentarios ';
              summary += 'inline en las líneas afectadas.\n';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary,
            });

            // 3) Las violaciones de arquitectura hacen fallar el check (gate de merge).
            if (comments.length > 0) {
              core.setFailed(`${comments.length} violación(es) de arquitectura detectada(s).`);
            }
