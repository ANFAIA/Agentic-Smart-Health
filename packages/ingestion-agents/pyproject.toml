[project]
name = "ingestion-agents"
version = "0.1.0"
description = "Agentes de ingesta del Digital Twin dental (1 modalidad = 1 soporte = 1 agente)"
requires-python = ">=3.11"
dependencies = [
    "core-schemas",
    "numpy>=2.0",
    "pydicom>=3.0",
    # `pydicom` solo descomprime los píxeles si hay un decodificador instalado, y el
    # CBCT clínico real llega comprimido: el Carestream CS 9600 de `histora` emite
    # JPEG Lossless (1.2.840.10008.1.2.4.70). Sin esto la ingesta falla en el último
    # paso, con el volumen ya localizado y ordenado — así que es camino por defecto,
    # no extra. (Para JPEG 2000 haría falta además `pylibjpeg-openjpeg`.)
    "pylibjpeg>=2.0",
    "pylibjpeg-libjpeg>=2.1",
    # El informe clínico llega como PDF (entregable Semana 3-4): la lectura de PDF
    # es parte del camino por defecto del `report-agent`, no un extra opcional.
    "pypdf>=5.0",
    # El `image-agent` decodifica la foto intraoral (JPG/PNG) y le quita el EXIF.
    "pillow>=10.0",
]

[project.optional-dependencies]
# El `report-agent` solo necesita un LLM cuando se le pide el backend `llm`;
# su backend por defecto (`rules`) es determinista y no requiere red ni clave.
llm = ["anthropic>=0.40"]
# HEIC (fotos de iPhone): el `image-agent` lee JPG/PNG sin esto; HEIC lo necesita.
heic = ["pillow-heif>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_agents"]

[tool.uv.sources]
core-schemas = { workspace = true }
