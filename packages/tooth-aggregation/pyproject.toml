[project]
name = "tooth-aggregation"
version = "0.1.0"
description = "Agregación punto → diente (instancias + FDI) para el segmentation-agent"
requires-python = ">=3.11"
# Sin `torch` a propósito: el forward del modelo (GPU) es del llamante, que pasa
# aquí las log-probabilidades como ndarray. Eso mantiene el paquete instalable y
# testeable en el workspace normal, sin el venv de GPU.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tooth_aggregation"]
