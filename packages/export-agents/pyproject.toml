[project]
name = "export-agents"
version = "0.1.0"
description = "Agentes de exportación del Digital Twin dental: regeneración de la malla (STL) desde el TwinSnapshot"
requires-python = ">=3.11"
dependencies = [
    "core-schemas",
    # La transformación rígida que hay que aplicar para exportar en el sistema de
    # referencia del twin la escribió la fusión geométrica, y su convención de
    # cuaternión vive en `fusion_agents.registration`. Reimplementarla aquí sería
    # duplicar justo lo que no se puede permitir divergir: una convención distinta
    # rompería la reversibilidad **en silencio**. La flecha apunta bien —la fase 6
    # va después de la 2— así que se importa en vez de copiar.
    "fusion-agents",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_agents"]

[tool.uv.sources]
core-schemas = { workspace = true }
fusion-agents = { workspace = true }
