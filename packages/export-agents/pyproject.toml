[project]
name = "export-agents"
version = "0.1.0"
description = "Agentes de exportación del Digital Twin dental: malla (STL), campo gaussiano (PLY) y render multivista (PNG) desde el TwinSnapshot"
requires-python = ">=3.11"
dependencies = [
    "core-schemas",
    # La transformación rígida que hay que aplicar para exportar en el sistema de
    # referencia del twin la escribió la fusión geométrica, y su convención de
    # cuaternión vive en `fusion_agents.registration`. Reimplementarla aquí sería
    # duplicar justo lo que no se puede permitir divergir: una convención distinta
    # rompería la reversibilidad **en silencio**. La flecha apunta bien —la fase 6
    # va después de la 2— así que se importa en vez de copiar.
    "fusion-agents",
    "numpy>=2.0",
    # El render del campo escribe PNG. `pillow` está declarado también en
    # `ingestion-agents`, pero ese paquete NO es dependencia de éste (solo de sus
    # tests), así que apoyarse en su instalación sería depender de un transitivo
    # que nadie promete.
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/export_agents"]

[tool.uv.sources]
core-schemas = { workspace = true }
fusion-agents = { workspace = true }
