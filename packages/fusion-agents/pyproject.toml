[project]
name = "fusion-agents"
version = "0.1.0"
description = "Agentes de fusión del Digital Twin dental: registro geométrico y anclaje semántico (ADR 004)"
requires-python = ">=3.11"
dependencies = [
    "core-schemas",
    "numpy>=2.0",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_agents"]

[tool.uv.sources]
core-schemas = { workspace = true }
