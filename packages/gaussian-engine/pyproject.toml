[project]
name = "gaussian-engine"
version = "0.1.0"
description = "Ajuste del campo gaussiano: de semillas isotropas de voxel a elipsoides medidos"
requires-python = ">=3.11"
dependencies = [
    # El campo ajustado sale como `TwinSnapshot`, con su `perfil_campo` y su esquema.
    "core-schemas",
    # `ArtifactStore` solo en las pruebas: el codigo toma el almacen como `Protocol`.
    "ingestion-agents",
    "numpy>=2.0",
    # El vecindario punto→gaussiana se recalcula con un KD-tree en CPU: son decenas de
    # miles de gaussianas, no merece GPU y asi el modulo se puede probar sin ella.
    "scipy>=1.14",
]

# torch va aparte A PROPOSITO, igual que en `analysis-agents`: importar este paquete no
# puede arrastrar CUDA a todo el que lo toque. `ajusta()` lo importa dentro de la funcion
# y lo dice claro si falta.
[project.optional-dependencies]
gpu = ["torch>=2.4"]
appearance = [
    "torch>=2.4",
    "gsplat>=1.0",
    "torchmetrics>=1.0",
    "Pillow>=10.0",
    # `pose_foto`: PnP (opencv) y watershed (scikit-image), para sacar el color MEDIDO de
    # las fotos en vez de pintar dos tonos. Van en este extra y no en las dependencias
    # base por el mismo criterio que torch: importar el paquete no puede arrastrarlos, y
    # el modulo los importa dentro de las funciones.
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
]

[tool.uv.sources]
core-schemas = { workspace = true }
ingestion-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaussian_engine"]
